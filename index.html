  <head>
    <meta charset="UTF-8" />

    <title>Doc &amp; PDF to Google Forms Converter</title>
    <meta name="description" content="Konversi soal Word dan PDF menjadi kuis Google Form secara otomatis, dilengkapi editor interaktif, ekspor CSV, riwayat konversi, batas waktu 5 menit hitung mundur per nomor, proteksi anti-kecurangan dengan penutupan otomatis, serta notifikasi Email &amp; WhatsApp." />
    <meta property="og:title" content="Doc &amp; PDF to Google Forms Converter" />
    <meta property="og:description" content="Konversi soal Word dan PDF menjadi kuis Google Form secara otomatis, dilengkapi editor interaktif, ekspor CSV, riwayat konversi, batas waktu 5 menit hitung mundur per nomor, proteksi anti-kecurangan dengan penutupan otomatis, serta notifikasi Email &amp; WhatsApp." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign Vite HMR WebSocket connection logs in sandboxed development environment
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || '' + reason)) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        var originalConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.indexOf('[vite]') !== -1 || firstArg.indexOf('WebSocket closed without opened') !== -1)) {
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
